services:
  # Web сервис для Django приложения
  - type: web
    name: uniquest-web
    env: python
    plan: free  # Бесплатный план
    # region: frankfurt  # Регион будет использован из существующего сервиса или по умолчанию
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py create_admin && gunicorn uniquest.wsgi:application --bind 0.0.0.0:$PORT --access-logfile - --error-logfile - --capture-output --log-level info
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DJANGO_SETTINGS_MODULE
        value: uniquest.settings
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com,uniquest.kz,www.uniquest.kz
      # Точные origin (без *): Render-хост добавится из RENDER_EXTERNAL_HOSTNAME в settings.py
      - key: CSRF_TRUSTED_ORIGINS
        value: https://uniquest.kz,https://www.uniquest.kz
      # Подключение к существующей базе данных
      - key: DATABASE_URL
        fromDatabase:
          name: uniquest1-db
          property: connectionString
      # Резервные переменные для базы данных
      - key: DB_NAME
        fromDatabase:
          name: uniquest1-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: uniquest1-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: uniquest1-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: uniquest1-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: uniquest1-db
          property: port

